<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="app.js"></script>
</head>

<body>

<h2>Room Setup</h2>

<div class="card">
<p id="roomId"></p>

Overs: <input id="overs" value="5"><br>

<label><input type="checkbox" id="striker"> Striker</label><br>
<label><input type="checkbox" id="bowler"> Bowler</label><br>

<button onclick="ready()">Ready</button>
<p id="status"></p>

<button onclick="start()">Start Match</button>
</div>

<script>
const room=getRoom();
roomId.innerText="Room: "+room;

const ref=db.ref("rooms/"+room);

function ready(){
 ref.child("players").push({ready:true});
 status.innerText="Ready ✅";
}

function start(){
 ref.update({
  config:{
   overs:Number(overs.value),
   striker:striker.checked,
   bowler:bowler.checked
  }
 });
 location="match.html?room="+room;
}
</script>

</body>
</html>
