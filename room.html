<!DOCTYPE html>
<html>
<body>

<h2>Odd Even Cricket</h2>

<input id="roomInput" placeholder="Room ID">
<br><br>

<button onclick="createRoom()">Create</button>
<button onclick="joinRoom()">Join</button>

<script type="module">

import { db, ref, set, get } from "./app.js";

const input = document.getElementById("roomInput");

window.createRoom = async () => {
  let room = input.value || Math.random().toString(36).slice(2,6);

  await set(ref(db, "rooms/" + room), {
    players: {},
    game: null
  });

  location.href = "match.html?room=" + room;
};

window.joinRoom = async () => {
  let room = input.value;

  let snap = await get(ref(db, "rooms/" + room));

  if(!snap.exists()){
    alert("Room not found");
    return;
  }

  location.href = "match.html?room=" + room;
};

</script>

</body>
</html>
