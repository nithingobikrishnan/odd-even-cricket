<!DOCTYPE html>
<html>
<head>
<script type="module">

import { db, ref, set } from "./app.js";
import { createGame } from "./engine.js";

window.createRoom = function(){

 let room = Math.random().toString(36).slice(2);

 let game = createGame();

 set(ref(db,"rooms/"+room),{game}).then(()=>{
  location="match.html?room="+room;
 });

}

</script>
</head>
<body>

<h2>Create Room</h2>
<button onclick="createRoom()">Start</button>

</body>
</html>
