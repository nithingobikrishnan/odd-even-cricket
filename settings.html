<!DOCTYPE html>
<html>
<body>

<h2>Settings</h2>

<input id="name" placeholder="Username">
<button onclick="save()">Save</button>

<script>
name.value = localStorage.getItem("username")||"";

function save(){
 localStorage.setItem("username", name.value);
 alert("Saved");
}
</script>

</body>
</html>
