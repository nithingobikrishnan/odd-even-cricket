<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPL Match</title>

<style>
body{background:#111;color:white;text-align:center;font-family:sans-serif}
button{padding:10px;margin:5px;background:#222;color:white;border:none}
#score{font-size:28px;font-weight:bold}
</style>

<script type="module">

import { db, ref, onValue, update } from "./app.js";
import { createGame, resolveBall } from "./engine.js";
import { botMove } from "./ai.js";

const params = new URLSearchParams(location.search);
const room = params.get("room");
const bot = params.get("bot");

let state = createGame();
let gameRef = room ? ref(db,"rooms/"+room) : null;
let timer;

// DOM FIX (no undefined)
const score = document.getElementById("score");
const info = document.getElementById("info");
const buttons = document.getElementById("buttons");
const crrEl = document.getElementById("crrEl");
const rrrEl = document.getElementById("rrrEl");

// MULTIPLAYER LISTENER
if(room){
 onValue(gameRef,(snap)=>{
  let data = snap.val();
  if(!data) return;

  state = data.game;
  render();
  processTurn();
 });
}

// PLAY FUNCTION
window.play = function(n){

 if(state.matchOver) return;

 if(state.batMove == null){

  state.batMove = n;
  startTimer();

  // BOT MODE ONLY
  if(bot){
   setTimeout(()=>{
    state.bowlMove = botMove(state);
    processTurn();
   }, 400);
  }

 } else {

  state.bowlMove = n;
  processTurn();
 }

 // ONLY multiplayer updates Firebase
 if(room){
  update(gameRef,{game:state});
 }
};

// TURN LOGIC
function processTurn(){

 if(state.batMove != null && state.bowlMove != null){

  clearTimeout(timer);

  let res = resolveBall(state);
  state = res.state;

  render();

  if(state.matchOver){
   alert("🏆 "+state.winner);
   localStorage.setItem("lastMatch", JSON.stringify(state));
   location = "result.html";
  }
 }
}

// TIMER
function startTimer(){
 clearTimeout(timer);

 timer = setTimeout(()=>{
  if(state.bowlMove == null){
   state.score += 1;
   alert("⏱️ Extra run");
   render();
  }
 },5000);
}

// RENDER UI
function render(){

 score.innerText = `${state.score}/${state.wk} (${state.over}.${state.ball%6})`;

 info.innerText = state.innings === 1
  ? "Innings 1"
  : "Target: " + state.target;

 // CRR
 let balls = state.ball || 1;
 let crr = (state.score/(balls/6)).toFixed(2);
 crrEl.innerText = "CRR: " + crr;

 // RRR
 if(state.innings === 2){
  let ballsLeft = (state.oversLimit*6) - state.ball;
  let runsLeft = state.target - state.score;

  let rrr = ballsLeft>0 ? (runsLeft/(ballsLeft/6)).toFixed(2) : 0;
  rrrEl.innerText = "RRR: " + rrr;
 }

 // BUTTONS
 let btnHTML = "";
 for(let i=0;i<=state.maxNumber;i++){
  btnHTML += `<button onclick="play(${i})">${i}</button>`;
 }
 buttons.innerHTML = btnHTML;
}

</script>
</head>

<body>

<h2 id="score"></h2>
<h3 id="info"></h3>

<div id="crrEl"></div>
<div id="rrrEl"></div>

<div id="buttons"></div>

</body>
</html>
