<!DOCTYPE html>
<html>
<body>

<h2 id="status">Loading...</h2>
<h3 id="role"></h3>
<h3 id="score">Score: 0</h3>
<h3 id="info">Bat: - | Bowl: -</h3>

<div id="buttons"></div>

<script type="module">

import { db, ref, set, onValue, update } from "./app.js";

const room = "test123";
const gameRef = ref(db, "rooms/" + room);

// DOM
const status = document.getElementById("status");
const roleEl = document.getElementById("role");
const scoreEl = document.getElementById("score");
const infoEl = document.getElementById("info");
const buttons = document.getElementById("buttons");

// player id
const playerId = Math.random().toString(36).slice(2);

// 🔥 FORCE RESET ROOM (IMPORTANT)
set(gameRef, {
 score: 0,
 batMove: null,
 bowlMove: null,
 batsman: null,
 bowler: null
});

// LISTENER
onValue(gameRef, (snap)=>{
 let data = snap.val();
 if(!data) return;

 status.innerText = "Connected";

 // assign roles ONCE
 if(!data.batsman){
  update(gameRef, { batsman: playerId });
  return;
 }
 if(!data.bowler && data.batsman !== playerId){
  update(gameRef, { bowler: playerId });
  return;
 }

 // show role
 if(data.batsman === playerId){
  roleEl.innerText = "BATSMAN";
 }
 else if(data.bowler === playerId){
  roleEl.innerText = "BOWLER";
 }
 else {
  roleEl.innerText = "Waiting...";
 }

 // safe display
 scoreEl.innerText = "Score: " + (data.score || 0);

 let bat = data.batMove === null ? "-" : data.batMove;
 let bowl = data.bowlMove === null ? "-" : data.bowlMove;

 infoEl.innerText = "Bat: " + bat + " | Bowl: " + bowl;

 // resolve turn (ONLY BATSMAN DOES THIS)
 if(data.batMove !== null && data.bowlMove !== null){

  if(data.batsman === playerId){

   let newScore = data.score || 0;

   if(data.batMove !== data.bowlMove){
    newScore += Number(data.batMove);
   } else {
    alert("WICKET!");
   }

   // RESET TURN HERE (single write)
   set(gameRef, {
    score: newScore,
    batMove: null,
    bowlMove: null,
    batsman: data.batsman,
    bowler: data.bowler
   });
  }
 }
});

// PLAY
window.play = function(n){

 onValue(gameRef, (snap)=>{
  let data = snap.val();
  if(!data) return;

  // batsman plays
  if(data.batsman === playerId && data.batMove === null){
   update(gameRef, { batMove: n });
  }

  // bowler plays
  if(data.bowler === playerId && data.bowlMove === null){
   update(gameRef, { bowlMove: n });
  }

 }, { onlyOnce: true });
};

// buttons
let btn = "";
for(let i=0;i<=6;i++){
 btn += `<button onclick="play(${i})">${i}</button>`;
}
buttons.innerHTML = btn;

</script>

</body>
</html>
