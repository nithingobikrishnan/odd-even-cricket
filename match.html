<!DOCTYPE html>
<html>
<body>

<h2 id="status">Loading...</h2>
<h3 id="role"></h3>
<h3 id="score"></h3>
<h3 id="info"></h3>

<div id="buttons"></div>

<script type="module">

import { db, ref, set, onValue, update, get } from "./app.js";

const room = "test123";
const gameRef = ref(db, "rooms/" + room);

// DOM
const status = document.getElementById("status");
const roleEl = document.getElementById("role");
const scoreEl = document.getElementById("score");
const infoEl = document.getElementById("info");
const buttons = document.getElementById("buttons");

// unique id
const playerId = localStorage.getItem("pid") || Math.random().toString(36).slice(2);
localStorage.setItem("pid", playerId);

// 🔥 SAFE DEFAULT STATE
const defaultState = {
 score: 0,
 batMove: null,
 bowlMove: null,
 batsman: null,
 bowler: null,
 turnResolved: false
};

// INIT ONLY ONCE
get(gameRef).then(snap=>{
 if(!snap.exists()){
  set(gameRef, defaultState);
 }
});

// LISTENER
onValue(gameRef, (snap)=>{

 if(!snap.exists()){
  status.innerText = "Initializing...";
  return;
 }

 let data = { ...defaultState, ...snap.val() }; // 🔥 FORCE DEFAULTS

 status.innerText = "Connected";

 // assign roles
 if(!data.batsman){
  update(gameRef, { batsman: playerId });
 }
 else if(!data.bowler && data.batsman !== playerId){
  update(gameRef, { bowler: playerId });
 }

 // role display
 if(data.batsman === playerId){
  roleEl.innerText = "You are BATSMAN";
 }
 else if(data.bowler === playerId){
  roleEl.innerText = "You are BOWLER";
 }
 else {
  roleEl.innerText = "Waiting...";
 }

 // SAFE DISPLAY (NO undefined possible)
 scoreEl.innerText = "Score: " + data.score;

 let bat = data.batMove === null ? "-" : data.batMove;
 let bowl = data.bowlMove === null ? "-" : data.bowlMove;

 infoEl.innerText = "Bat: " + bat + " | Bowl: " + bowl;

 // TURN RESOLVE
 if(data.batMove !== null && data.bowlMove !== null && !data.turnResolved){

  if(data.batsman === playerId){

   let b1 = Number(data.batMove) || 0;
   let b2 = Number(data.bowlMove) || 0;

   let newScore = data.score;

   if(b1 !== b2){
    newScore += b1;
   } else {
    alert("WICKET!");
   }

   update(gameRef, {
    score: newScore,
    batMove: null,
    bowlMove: null,
    turnResolved: true
   });

   setTimeout(()=>{
    update(gameRef, { turnResolved: false });
   }, 200);
  }
 }
});

// PLAY
window.play = function(n){

 get(gameRef).then(snap=>{
  let data = snap.val();
  if(!data) return;

  if(data.batsman === playerId && data.batMove === null){
   update(gameRef, { batMove: n });
  }

  if(data.bowler === playerId && data.bowlMove === null){
   update(gameRef, { bowlMove: n });
  }
 });
};

// BUTTONS
let btn = "";
for(let i=0;i<=6;i++){
 btn += `<button onclick="play(${i})">${i}</button>`;
}
buttons.innerHTML = btn;

</script>

</body>
</html>
