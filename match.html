<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>

<body>

<h2 id="score"></h2>
<div id="buttons"></div>

<script>

let score = document.getElementById("score");
let buttons = document.getElementById("buttons");

let runs = 0;

function play(n){
 runs += n;
 render();
}

function render(){
 score.innerText = "Score: " + runs;

 let btn = "";
 for(let i=0;i<=6;i++){
  btn += `<button onclick="play(${i})">${i}</button>`;
 }
 buttons.innerHTML = btn;
}

render();

</script>

</body>
</html>
