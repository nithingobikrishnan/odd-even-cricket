<!DOCTYPE html>
<html>
<body>

<h2 id="status">Connected</h2>
<h3 id="score">Score: 0</h3>
<h3 id="info">Bat: - | Bowl: -</h3>

<div id="buttons"></div>

<script type="module">

import { db, ref, set, onValue, update } from "./app.js";

const room = "test123";
const gameRef = ref(db, "rooms/" + room);

// player id
const playerId = localStorage.getItem("pid") || Math.random().toString(36).slice(2);
localStorage.setItem("pid", playerId);

// INIT
set(gameRef, {
 score: 0,
 batMove: null,
 bowlMove: null,
 lastPlayer: null
});

// UI
const scoreEl = document.getElementById("score");
const infoEl = document.getElementById("info");
const buttons = document.getElementById("buttons");

// LISTENER
onValue(gameRef, (snap)=>{
 let d = snap.val();
 if(!d) return;

 let score = d.score || 0;
 let bat = d.batMove;
 let bowl = d.bowlMove;

 scoreEl.innerText = "Score: " + score;
 infoEl.innerText = 
  "Bat: " + (bat ?? "-") + 
  " | Bowl: " + (bowl ?? "-");

 // RESOLVE
 if(bat !== null && bowl !== null){

  let newScore = score;

  if(bat !== bowl){
   newScore += Number(bat);
  } else {
   alert("WICKET!");
  }

  // RESET
  set(gameRef, {
   score: newScore,
   batMove: null,
   bowlMove: null,
   lastPlayer: null
  });
 }
});

// PLAY
window.play = function(n){

 onValue(gameRef, (snap)=>{
  let d = snap.val();
  if(!d) return;

  // FIRST PLAYER becomes BAT
  if(d.batMove === null){
   update(gameRef, {
    batMove: n,
    lastPlayer: playerId
   });
  }
  // SECOND PLAYER becomes BOWL
  else if(d.bowlMove === null && d.lastPlayer !== playerId){
   update(gameRef, {
    bowlMove: n
   });
  }

 }, { onlyOnce: true });
};

// BUTTONS
let btn="";
for(let i=0;i<=6;i++){
 btn+=`<button onclick="play(${i})">${i}</button>`;
}
buttons.innerHTML=btn;

</script>

</body>
</html>
