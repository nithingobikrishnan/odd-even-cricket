<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script type="module">

import { db, ref, onValue, update } from "./app.js";
import { resolveBall } from "./engine.js";

const params = new URLSearchParams(location.search);
const room = params.get("room");
const bot = params.get("bot");

let state;
let timer;

let gameRef = room ? ref(db,"rooms/"+room) : null;

// 🔁 LISTENER
if(room){
 onValue(gameRef,(snap)=>{
  let data = snap.val();
  if(!data || !data.game) return;

  state = data.game;
  render();

  processTurn();
 });
} else {
 // 🤖 SINGLEPLAYER INIT
 state = {
  score:0, wk:0, ball:0, over:0,
  innings:1, target:null,
  matchOver:false, winner:null,
  oversLimit:2, maxNumber:10,
  batMove:null, bowlMove:null
 };
 render();
}

// 🔥 CORE TURN PROCESS
function processTurn(){

 if(state.matchOver){
  alert("🏆 " + state.winner);
  localStorage.setItem("lastMatch", JSON.stringify(state));
  location = "result.html";
  return;
 }

 if(state.batMove!=null && state.bowlMove!=null){

  clearTimeout(timer);

  let {state:newState, result} = resolveBall(state);

  showResult(result);

  if(room){
   update(gameRef,{game:newState});
  } else {
   state = newState;
   render();
  }
 }
}

// 🎮 PLAYER MOVE
window.play = function(n){

 if(state.matchOver) return;

 if(state.batMove==null){
  state.batMove = n;

  if(room){
    update(gameRef,{ "game/batMove":n });
  }

  // 🤖 AI RESPONSE
  if(bot){
    setTimeout(()=>{
      botMove();
    },500);
  }

  startTimer();

 } else {
  state.bowlMove = n;

  if(room){
    update(gameRef,{ "game/bowlMove":n });
  } else {
    processTurn();
  }
 }
}

// 🤖 AI LOGIC (SAFE)
function botMove(){

 if(state.matchOver) return;

 let move = Math.floor(Math.random() * (state.maxNumber+1));

 state.bowlMove = move;

 processTurn();
}

// ⏱️ TIMER
function startTimer(){

 clearTimeout(timer);

 timer = setTimeout(()=>{
  if(state.bowlMove==null){
   alert("⏱️ Extra run!");
   state.score += 1;

   if(room){
    update(gameRef,{game:state});
   } else {
    render();
   }
  }
 },5000);
}

// 📢 RESULT
function showResult(r){
 if(r==="W"){
  alert("❌ OUT!");
 } else {
  alert("🏏 "+r+" runs");
 }
}

// 🎨 RENDER
function render(){

 document.getElementById("score").innerText =
  state.score+"/"+state.wk+" ("+state.over+"."+state.ball%6+")";

 document.getElementById("info").innerText =
  state.innings === 1
   ? "Innings 1"
   : "Target: " + state.target;

 // CRR
 let balls = state.ball || 1;
 let crr = (state.score / (balls/6)).toFixed(2);
 document.getElementById("crr").innerText = "CRR: " + crr;

 // RRR
 if(state.innings === 2){
  let ballsLeft = (state.oversLimit*6) - state.ball;
  let runsLeft = state.target - state.score;
  let rrr = ballsLeft>0 ? ((runsLeft/(ballsLeft/6))).toFixed(2) : 0;

  document.getElementById("rrr").innerText = "RRR: " + rrr;
 }

 let btns = document.getElementById("btns");
 btns.innerHTML="";

 for(let i=0;i<=state.maxNumber;i++){
  let b=document.createElement("button");
  b.innerText=i;
  b.onclick=()=>play(i);
  btns.appendChild(b);
 }
}

</script>
</head>

<body>

<h2 id="score">Loading...</h2>
<h3 id="info"></h3>
<div id="crr"></div>
<div id="rrr"></div>

<div id="btns"></div>

</body>
</html>
