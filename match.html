<!DOCTYPE html>
<html>
<body>

<h2 id="status">Connecting...</h2>
<h3 id="role"></h3>
<h3 id="score"></h3>
<h3 id="info"></h3>

<div id="buttons"></div>

<script type="module">

import { db, ref, set, update, get, onValue } from "./app.js";

// ROOM
const params = new URLSearchParams(location.search);
const room = params.get("room");

const roomRef = ref(db, "rooms/" + room);
const gameRef = ref(db, "rooms/" + room + "/game");

// PLAYER
const playerId = localStorage.getItem("pid") || Math.random().toString(36).slice(2);
localStorage.setItem("pid", playerId);

// DEFAULT GAME
const defaultGame = {
  score: 0,
  wickets: 0,
  batMove: null,
  bowlMove: null,
  batsman: null,
  bowler: null
};

// DOM
const status = document.getElementById("status");
const roleEl = document.getElementById("role");
const scoreEl = document.getElementById("score");
const infoEl = document.getElementById("info");

// JOIN ROOM
async function join(){

  let snap = await get(roomRef);
  let data = snap.val() || {};

  let players = data.players || {};

  if(Object.keys(players).length >= 2 && !players[playerId]){
    alert("Room full");
    return;
  }

  players[playerId] = true;
  await update(roomRef, { players });

  // INIT GAME
  let gameSnap = await get(gameRef);
  if(!gameSnap.exists()){
    await set(gameRef, defaultGame);
  }
}

join();

// LISTENER
onValue(gameRef, (snap)=>{
  let d = snap.val();
  if(!d) return;

  status.innerText = "Connected";

  // assign roles
  if(!d.batsman){
    update(gameRef, { batsman: playerId });
    return;
  }

  if(!d.bowler && d.batsman !== playerId){
    update(gameRef, { bowler: playerId });
    return;
  }

  // role UI
  if(d.batsman === playerId){
    roleEl.innerText = "BATSMAN";
  } else if(d.bowler === playerId){
    roleEl.innerText = "BOWLER";
  } else {
    roleEl.innerText = "WAITING";
  }

  scoreEl.innerText = "Score: " + (d.score || 0) + "/" + (d.wickets || 0);

  infoEl.innerText =
    "Bat: " + (d.batMove ?? "-") +
    " | Bowl: " + (d.bowlMove ?? "-");

  // resolve
  if(d.batMove !== null && d.bowlMove !== null){

    if(d.batsman === playerId){

      let score = d.score || 0;
      let wickets = d.wickets || 0;

      if(d.batMove === d.bowlMove){
        wickets++;
      } else {
        score += Number(d.batMove);
      }

      set(gameRef, {
        score,
        wickets,
        batMove: null,
        bowlMove: null,
        batsman: d.batsman,
        bowler: d.bowler
      });
    }
  }
});

// PLAY
window.play = async function(n){

  let snap = await get(gameRef);
  let d = snap.val();

  if(!d) return;

  if(d.batsman === playerId && d.batMove === null){
    update(gameRef, { batMove: n });
  }

  if(d.bowler === playerId && d.bowlMove === null){
    update(gameRef, { bowlMove: n });
  }
};

// BUTTONS
let btn = "";
for(let i=0;i<=6;i++){
  btn += `<button onclick="play(${i})">${i}</button>`;
}
document.getElementById("buttons").innerHTML = btn;

</script>

</body>
</html>
