<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script type="module">

import { db, ref, onValue, update } from "./app.js";
import { resolveBall } from "./engine.js";

const params = new URLSearchParams(location.search);
const room = params.get("room");

let state;
let timer;

const gameRef = ref(db,"rooms/"+room);

onValue(gameRef,(snap)=>{
 let data = snap.val();
 if(!data || !data.game) return;

 state = data.game;

 render();

 if(state.matchOver){
  alert("🏆 " + state.winner);
  localStorage.setItem("lastMatch", JSON.stringify(state));
  location = "result.html";
  return;
 }

 if(state.batMove!=null && state.bowlMove!=null){

  clearTimeout(timer);

  let {state:newState, result} = resolveBall(state);

  showResult(result);

  update(gameRef,{game:newState});
 }
});

window.play = function(n){

 if(state.batMove==null){
  update(gameRef,{ "game/batMove":n });
  startTimer();
 } else {
  update(gameRef,{ "game/bowlMove":n });
 }
}

function startTimer(){

 clearTimeout(timer);

 timer = setTimeout(()=>{
  if(state.bowlMove==null){
   state.score += 1;
   update(gameRef,{game:state});
   alert("⏱️ Extra run!");
  }
 },5000);
}

function showResult(r){
 if(r==="W"){
  alert("❌ OUT!");
 } else {
  alert("🏏 "+r+" runs");
 }
}

function render(){

 document.getElementById("score").innerText =
  state.score+"/"+state.wk+" ("+state.over+"."+state.ball%6+")";

 document.getElementById("info").innerText =
  state.innings === 1
   ? "Innings 1"
   : "Target: " + state.target;

 // CRR
 let balls = state.ball || 1;
 let crr = (state.score / (balls/6)).toFixed(2);

 document.getElementById("crr").innerText = "CRR: " + crr;

 // RRR
 if(state.innings === 2){
  let ballsLeft = (state.oversLimit*6) - state.ball;
  let runsLeft = state.target - state.score;

  let rrr = ballsLeft>0 ? ((runsLeft/(ballsLeft/6))).toFixed(2) : 0;

  document.getElementById("rrr").innerText = "RRR: " + rrr;
 }

 let btns = document.getElementById("btns");
 btns.innerHTML="";

 for(let i=0;i<=state.maxNumber;i++){
  let b=document.createElement("button");
  b.innerText=i;
  b.onclick=()=>play(i);
  btns.appendChild(b);
 }
}

</script>
</head>

<body>

<h2 id="score">Loading...</h2>
<h3 id="info"></h3>
<div id="crr"></div>
<div id="rrr"></div>

<div id="btns"></div>

</body>
</html>
